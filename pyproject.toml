[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rectify"
version = "0.1.0"
description = "Apply consultant review comments to engineering drawing PDFs as vector edits."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26",
    "anthropic>=0.70",
    "pillow>=10",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.40", "pandas>=2.0"]

[project.scripts]
rectify = "rectify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
